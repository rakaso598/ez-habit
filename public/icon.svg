<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>
  
  <!-- 습관 아이콘 -->
  <g transform="translate(128, 128)">
    <!-- 체크박스 -->
    <rect x="0" y="0" width="256" height="256" rx="32" fill="white" opacity="0.9"/>
    <rect x="8" y="8" width="240" height="240" rx="24" fill="url(#gradient)" opacity="0.1"/>
    
    <!-- 체크 표시 -->
    <path d="M64 128 L112 176 L192 96" stroke="url(#gradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 습관 텍스트 -->
    <text x="128" y="220" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">습관</text>
  </g>
  
  <!-- 그라데이션 정의 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg> 